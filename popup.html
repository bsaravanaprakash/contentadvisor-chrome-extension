<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AEM SideKick</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 1rem;
      margin: 0;
    }
    #container {
      width: 800px;
    }
    .assetSelectorContainer {
      margin-top: 1rem;
      width: 770px;
    }
    h3 {
      margin-top: 0;
      color: #1a237e;
      letter-spacing: 0.5px;
      font-size: 1.7rem;
      text-align: center;
    }
    #asset-selector {
      height: 540px;
      width: 100%;
      min-width: unset;
      min-height: unset;
      max-width: 100%;
      max-height: 100%;
      box-sizing: border-box;
      transition: width 0.3s, height 0.3s;
    }
    #status {
      margin-top: 14px;
      font-size: 13px;
      color: #374151;
      min-height: 18px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h3>AEM SideKick</h3>

  <div id="container">
    <label for="fileInput">Ad Preview URL:</label>
    <a href="#" target="_blank" id="previewUrl"></a>
    <div class="assetSelectorContainer">
      <div id="asset-selector" style="height: 540px; border: 1px solid #ccc; margin-bottom: 24px;"></div>
    </div>
</div>
  <div id="status"></div>
  <div class="page-data" style="font-size: 0.25rem;"> </div>
  <script src="assets-selector.js"></script>
  <script src="popup.js"></script>
</body>
</html>
